name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: stable all features
            toolchain: stable
            command: cargo test --all-features
          - name: stable no default features
            toolchain: stable
            command: cargo test --no-default-features
          - name: stable native float without fixed
            toolchain: stable
            command: cargo test --no-default-features --features native-float
          - name: MSRV all features
            toolchain: "1.93"
            command: cargo test --all-features
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - run: ${{ matrix.command }}

  target-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 32-bit Linux
            target: i686-unknown-linux-gnu
            features: --all-features
          - name: Cortex-M no FPU
            target: thumbv7em-none-eabi
            features: --no-default-features
          - name: Cortex-M hard float
            target: thumbv7em-none-eabihf
            features: --no-default-features
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --lib --target ${{ matrix.target }} ${{ matrix.features }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings
